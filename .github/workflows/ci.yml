name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prek
        run: python -m pip install --disable-pip-version-check prek==0.5.12
      - name: Run hooks
        run: prek run --all-files
      - name: Build and test print pipeline
        run: make test
