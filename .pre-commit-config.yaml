repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^vendor/
      - id: end-of-file-fixer
        exclude: ^vendor/
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--isolated, --select=E4,E7,E9,F]

  - repo: local
    hooks:
      - id: check-shell-syntax
        name: Check shell syntax
        entry: sh -c 'for file do sh -n "$file" || exit; done' --
        language: system
        files: ^tools/.*\.sh$
      - id: check-python-syntax
        name: Check Python syntax
        entry: python3 -m py_compile
        language: system
        types: [python]
        files: ^tools/
